name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Run tests
      run: ./gradlew test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          **/build/test-results/test/*.xml
          **/build/reports/tests/test/

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Windows MSI
      run: ./gradlew :desktop:packageMsi
      shell: bash

    - name: Build Windows JAR
      run: ./gradlew :desktop:packageWindowsJar
      shell: bash

    - name: Upload Windows MSI
      uses: actions/upload-artifact@v4
      with:
        name: windows-msi
        path: desktop/build/compose/binaries/main/msi/*.msi

    - name: Upload Windows JAR
      uses: actions/upload-artifact@v4
      with:
        name: windows-jar
        path: desktop/build/windows/*.jar

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build macOS DMG
      run: ./gradlew :desktop:packageDmg

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: desktop/build/compose/binaries/main/dmg/*.dmg

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Linux DEB
      run: ./gradlew :desktop:packageDeb

    - name: Upload Linux DEB
      uses: actions/upload-artifact@v4
      with:
        name: linux-deb
        path: desktop/build/compose/binaries/main/deb/*.deb

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build unsigned release APK
      run: ./gradlew :android:assembleRelease

    - name: Sign APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Get version from gradle.properties
        VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)

        # Find the unsigned APK
        UNSIGNED_APK=$(find android/build/outputs/apk/release -name "*.apk" | head -1)

        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "No signing secrets configured, renaming APK as unsigned"
          # Rename to indicate it's unsigned
          mv "$UNSIGNED_APK" "android/build/outputs/apk/release/dongadeuce-${VERSION}-unsigned.apk"
          exit 0
        fi

        # Decode keystore
        echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks

        SIGNED_APK="android/build/outputs/apk/release/dongadeuce-${VERSION}.apk"

        # Sign with apksigner
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks release-keystore.jks \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --ks-key-alias "$KEY_ALIAS" \
          --key-pass pass:"$KEY_PASSWORD" \
          --out "$SIGNED_APK" \
          "$UNSIGNED_APK"

        # Remove unsigned APK
        rm "$UNSIGNED_APK"

        # Clean up keystore
        rm release-keystore.jks

        echo "Signed APK created: $SIGNED_APK"

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/build/outputs/apk/release/dongadeuce-*.apk

  create-release:
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/windows-msi/*.msi
          artifacts/windows-jar/*.jar
          artifacts/macos-dmg/*.dmg
          artifacts/linux-deb/*.deb
          artifacts/android-apk/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
